<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a4f4c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OTF Orders">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>In-house Products Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: single column order slip under the street-sign logo; item picker opens as a bottom sheet; sticky action bar */
:root{
  --bg:#f3eedf; --paper:#fffbf2; --ink:#18302e; --muted:#5d6f6c; --line:#e0d6bf;
  --teal:#0f7470; --teal-deep:#0a4f4c; --cream:#fff1cc; --rust:#a3402c; --chip:#e7f0ed; --scrim:rgba(10,30,28,.45);
  --wa:#178a4a;
  --pdf-bg:#ffffff; --pdf-ink:#1b2b2a; --pdf-line:#d9d2bf; --pdf-band:#0a4f4c; --pdf-soft:#f4f1e6;
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1615; --paper:#132220; --ink:#ebe5d4; --muted:#9db0ab; --line:#27403c;
  --teal:#34a99a; --teal-deep:#0b3a37; --cream:#fff1cc; --rust:#e3836a; --chip:#1a2f2c; --scrim:rgba(0,0,0,.6); --wa:#25a95e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1615; --paper:#132220; --ink:#ebe5d4; --muted:#9db0ab; --line:#27403c;
  --teal:#34a99a; --teal-deep:#0b3a37; --cream:#fff1cc; --rust:#e3836a; --chip:#1a2f2c; --scrim:rgba(0,0,0,.6); --wa:#25a95e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
.wrap{max-width:680px;margin:0 auto;padding-left:16px;padding-right:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{width:min(250px,58vw);height:auto;display:block}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper);flex:none}
.lang button{font:inherit;font-weight:600;font-size:14px;border:0;background:transparent;color:var(--ink);padding:7px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--teal);color:#fff}
h1{font-size:20px;margin:2px 0 0;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:13px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:15px;font-weight:700;color:var(--teal);display:flex;align-items:center;gap:8px;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label,.lbl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:1px}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3}
.seg.depts{display:grid;grid-template-columns:repeat(3,1fr)}
@media (max-width:360px){.seg.depts{grid-template-columns:1fr 1fr}}
.seg button small{font-weight:400;font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.seg button[aria-pressed="true"] small{color:#e3f3f0}
.seg.prio button[aria-pressed="true"][data-v="urgent"]{background:var(--rust);border-color:var(--rust)}

.addbtn{font:inherit;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border-radius:10px;border:2px dashed var(--teal);background:var(--chip);color:var(--teal);cursor:pointer}
.addbtn svg{width:20px;height:20px}
.sample{font-size:11.5px;font-weight:600;color:var(--rust);border:1px solid var(--rust);border-radius:999px;padding:1px 8px}
.count{font-size:12px;font-weight:600;color:var(--muted)}

.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .nm{min-width:0;font-weight:600;line-height:1.35}
.line .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;flex-wrap:wrap}
.id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;direction:ltr;unicode-bidi:isolate;background:var(--chip);border-radius:4px;padding:0 5px;color:var(--ink)}
.qty{display:flex;align-items:center;gap:6px}
.qty input{width:84px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;padding:8px 6px}
.qty input.err{border-color:var(--rust);background:color-mix(in srgb,var(--rust) 10%,var(--bg))}
.qty span{font-size:12px;color:var(--muted);min-width:30px}
.rm{border:0;background:transparent;color:var(--muted);cursor:pointer;width:34px;height:34px;border-radius:8px;font-size:20px;line-height:1}
.rm:hover{background:var(--chip);color:var(--rust)}
.empty{color:var(--muted);text-align:center;padding:14px 4px;margin:0;font-size:14px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--teal-deep);color:var(--cream);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar b{font-variant-numeric:tabular-nums;font-size:17px}
.btn{font:inherit;font-weight:700;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.cream{background:var(--cream);color:#0a4f4c}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.btn.wa{background:var(--wa);color:#fff}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.link{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;font-size:13px}

/* sheets */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--scrim);z-index:10;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:88vh;max-height:88dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet{border-radius:16px;max-height:80vh}}
.sh-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.sh-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-title h3{margin:0;font-size:16px}
.x{border:0;background:var(--chip);color:var(--ink);width:34px;height:34px;border-radius:999px;cursor:pointer;font-size:18px;flex:none}
.search{position:relative}
.search input{padding-inline-start:38px;font-size:16px}
.search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cats button{font:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.results{overflow-y:auto;flex:1;min-height:180px}
.res{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;width:100%;text-align:start;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 16px;cursor:pointer}
.res:hover,.res:focus-visible{background:var(--chip);outline:none}
.res .nm{font-weight:600;min-width:0}
.res .alt{font-size:12.5px;color:var(--muted);display:block;font-weight:400}
.res mark{background:color-mix(in srgb,var(--teal) 22%,transparent);color:inherit;border-radius:2px}
.res .side{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.res .in{font-size:11px;font-weight:700;color:var(--teal)}
.res[aria-disabled="true"]{opacity:.55}
.qtybox{padding:16px;display:flex;flex-direction:column;gap:12px}
.qtybox .pick{font-size:18px;font-weight:700;line-height:1.35}
.qtybox .row{display:flex;gap:8px;align-items:center}
.qtybox .row input{font-size:22px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;max-width:180px}
.qtybox .unit{font-weight:600;color:var(--muted)}
.qtybox .acts{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.err-msg{color:var(--rust);font-size:13px;font-weight:600;margin:0}

.review{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.thumbs img{width:min(260px,70vw);border:1px solid var(--line);border-radius:6px;background:#fff;flex:none;max-width:100%}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.orderno{margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.orderno b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;color:var(--ink);direction:ltr;unicode-bidi:isolate}
.status{font-size:13px;font-weight:600;margin:0;color:var(--teal)}
.status.bad{color:var(--rust)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:90vw;text-align:center}

/* off-screen PDF pages: always print-light */
#pdfStage{position:fixed;left:-12000px;top:0;width:794px}
.pp{width:794px;height:1123px;background:var(--pdf-bg);color:var(--pdf-ink);font-family:var(--font);padding:40px 42px 34px;display:flex;flex-direction:column;gap:14px;position:relative;line-height:1.45}
.pp-head{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:3px solid var(--pdf-band);padding-bottom:12px}
.pp-head img{width:230px}
.pp-title{text-align:right;display:flex;flex-direction:column;gap:2px}
.pp-title b{font-size:22px;color:var(--pdf-band);line-height:1.3}
.pp-title b.en{font-size:17px}
.pp-title span{font-size:14px}
.pp-title .noline{display:flex;gap:10px;justify-content:flex-end;align-items:baseline}
.pp-title .chefname{font-size:15px;font-weight:700;color:var(--pdf-band)}
.pp-title .no{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;direction:ltr}
.pp-info{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--pdf-line);border-radius:6px;overflow:hidden}
.pp-info div{padding:7px 10px;border-inline-end:1px solid var(--pdf-line);border-bottom:1px solid var(--pdf-line);display:flex;flex-direction:column;font-size:13.5px;font-weight:600}
.pp-info div:nth-child(3n){border-inline-end:0}
.pp-info small{font-size:10.5px;font-weight:500;color:#6a7471}
.pp-info .urgent{color:#a3402c}
.pp-body{flex:1;min-height:0;overflow:hidden}
.pp table{width:100%;border-collapse:collapse;font-size:13px}
.pp th{background:var(--pdf-band);color:#fff;font-weight:600;padding:6px 8px;text-align:left;font-size:11.5px}
.pp th.ar,.pp td.ar{text-align:right;direction:rtl}
.pp td{padding:5px 8px;border-bottom:1px solid var(--pdf-line);vertical-align:middle}
.pp td.n{text-align:center;color:#6a7471;width:30px}
.pp td.i{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;width:78px}
.pp td.q{text-align:center;font-weight:700;width:80px;font-variant-numeric:tabular-nums}
.pp td.u{width:96px;text-align:center;font-size:12px;white-space:nowrap}
.pp th{white-space:nowrap}
.pp tr.cat td{background:var(--pdf-soft);font-weight:700;color:var(--pdf-band);font-size:12px;padding:5px 8px}
.pp tr.cat td span{float:right;direction:rtl}
.pp .notes{border:1px solid var(--pdf-line);border-radius:6px;padding:8px 10px;font-size:13px;margin-top:12px}
.pp .notes small{display:block;color:#6a7471;font-size:10.5px}
.pp .sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:22px;font-size:12px;color:#6a7471}
.pp .sign div{border-top:1px solid #9aa39f;padding-top:5px;display:flex;justify-content:space-between}
.pp-foot{display:flex;justify-content:space-between;font-size:10.5px;color:#6a7471;border-top:1px solid var(--pdf-line);padding-top:6px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

const norm = s => String(s).toLowerCase().replace(/['’`]/g,"").replace(/[إأآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ًٌٍَُِّْـ]/g,"").replace(/[()\-–.&]/g," ");

function renderLines(){
  const c = cart();

function hl(text,q){
  if(!q) return text;
  const n = norm(text); const words = n.split(/\s+/); let pos = 0, idx=-1;
  // find word start in normalized string that begins with q
  const re = new RegExp("(^|\\s)"+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const m = n.match(re); if(m){ idx = m.index + m[1].length } else { idx = n.indexOf(q) }
  if(idx<0 || n.length!==text.length) return text;
  return text.slice(0,idx)+"<mark>"+text.slice(idx,idx+q.length)+"</mark>"+text.slice(idx+q.length);
}
function score(it,q){
  if(!q) return 1;
  const id = it.id.toLowerCase().replace(/[^a-z0-9]/g,""), qi = q.replace(/[^a-z0-9]/g,"");
  const en = norm(it.en), ar = norm(it.ar), kw = norm(it.k||"");
  if(en.startsWith(q) || ar.startsWith(q)) return 3;
  if(kw && kw.split(/\s+/).some(w=>w.startsWith(q))) return 2;
  if(en.split(/\s+/).some(w=>w.startsWith(q)) || ar.split(/\s+/).some(w=>w.startsWith(q))) return 2;
  if(qi && qi.length>=2 && id.startsWith(qi)) return 2;
  if(q.length>=3 && (en.includes(q)||ar.includes(q))) return 1;
  return 0;
}
function renderResults(){
  const q = norm($("q").value.trim()).trim();
  const inCart = new Set(cart().map(r=>r.id));
  const list = itemsOf(state.dept)
    .filter(it=>state.cat==="ALL" || it.id.startsWith(state.cat))
    .map(it=>[it,score(it,q)]).filter(([,s])=>s>0)
    .sort((a,b)=>b[1]-a[1]);
  if(!list.length){ $("results").innerHTML = `<p class="empty">${tr("noRes")}</p>`; return }
  $("results").innerHTML = list.map(([it])=>{
    const main = L(it), alt = state.lang==="ar"? it.en : it.ar;
    return `<button type="button" class="res" data-id="${it.id}"><span class="nm">${hl(main,q)}<span class="alt">${hl(alt,q)}</span></span>
      <span class="side"><span class="id">${it.id}</span>${inCart.has(it.id)?`<span class="in">✓ ${tr("inOrder")}</span>`:""}</span></button>`;
  }).join("");
}
function choose(id){
  const it = findItem(state.dept,id); state.pick = it;
  const existing = cart().find(r=>r.id===id);
  $("searchPane").hidden=true; $("results").hidden=true; $("qtybox").hidden=false;
  $("pickName").textContent = L(it);
  $("pickMeta").innerHTML = `<span class="id">${it.id}</span><span>${state.lang==="ar"?it.en:it.ar}</span>`;
  $("pickUnit").textContent = L(UNITS[it.u]);
  $("pickQty").value = existing ? existing.q : "";
  $("pickErr").hidden = true;
  setTimeout(()=>$("pickQty").focus(),30);
}
function commitPick(close){
  const v = toLatinDigits($("pickQty").value.trim());
  if(!(num(v)>0)){ $("pickErr").hidden=false; $("pickQty").focus(); return }
  markUsed(); edited();
  const c = cart(); const ex = c.find(r=>r.id===state.pick.id);
  if(ex) ex.q = v; else c.push({id:state.pick.id,q:v});
  persist(); renderLines(); render();
  toast(`${tr("added")}: ${L(state.pick)} — ${fmt(num(v))} ${L(UNITS[state.pick.u])}`);
  if(close){ closeSheet($("picker")) } else { showSearch(); $("q").value=""; renderResults(); $("q").focus() }
}

/* ---------- sequential order numbers ---------- */
const TAB = Math.random().toString(36).slice(2) + Date.now().toString(36);
const pad = n => String(n).padStart(4,"0");
let dbNS; 
async function getDb(){
  if(dbNS !== undefined) return dbNS;
  try{ dbNS = (window.claude && window.claude.use) ? await window.claude.use("db") : null }catch(e){ dbNS = null }
  return dbNS;
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
/* one shared counter for the whole restaurant; a short lock stops two chefs getting the same number */
async function nextSharedNo(db){
  const ref = db.doc("meta/counter");
  for(let i=0;i<10;i++){
    const r = await ref.acquire({holder:TAB, ttlMs:8000});
    if(r.acquired){
      const s = await ref.get();
      const last = (s.exists && Number(s.data().last)) || 0;
      const n = last + 1;
      if(s.exists) await ref.update({last:n, at:new Date().toISOString()});
      else await ref.set({last:n, at:new Date().toISOString()});
      return n;
    }
    const wait = r.expiresAt ? Math.min(Math.max(new Date(r.expiresAt).getTime()-Date.now(), 300), 8000) : 700;
    await sleep(wait + Math.random()*400);
  }
  throw new Error("counter busy");
}
function chefCode(){ const w = (state.chef[state.dept]||"XX").split(/\s+/).filter(Boolean); return (w.length>1 ? w[0][0]+w[1][0] : w[0].slice(0,2)).toUpperCase() }
async function ensureNo(){
  const held = state.nums[state.dept];
  if(held && !held.sent) return held;
  const db = await getDb();
  let rec = null;
  if(db){
    try{ const n = await nextSharedNo(db); rec = {no:`OTF-${pad(n)}`, n, shared:true, sent:false} }catch(e){ console.warn("shared counter failed", e) }
  }
  if(!rec){
    const n = (parseInt(store.get("otf.localSeq")||"0",10)||0) + 1; store.set("otf.localSeq", String(n));
    rec = {no:`OTF-${chefCode()}-${pad(n)}`, n, shared:false, sent:false};
  }
  state.nums[state.dept] = rec; saveNums();
  return rec;
}
async function logOrder(o){
  const db = await getDb(); const held = state.nums[state.dept];
  if(!db || !held || !held.shared) return;
  try{
    await db.doc("orders/"+pad(held.n)).set({
      no:o.no, n:held.n, dept:state.dept, deptName:o.d.en, deptAr:o.d.ar, chef:o.chef[0], chefAr:o.chef[1], date:o.date,
      neededBy:o.when.en, neededByAr:o.when.ar, priority:o.prio, notes:o.notes, status:"created",
      items:o.rows.map(r=>({id:r.it.id, item:r.it.en, itemAr:r.it.ar, qty:r.q, unit:r.it.u})), createdAt:new Date().toISOString()
    });
  }catch(e){ console.warn("order log failed", e) }
}
function validate(){
  if(!state.chef[state.dept]){ toast(tr("needChef")); $("chef").focus(); return false }
  if(!cart().length){ toast(tr("needItems")); return false }
  if(cart().some(r=>!(num(r.q)>0))){ toast(tr("fixQty")); renderLines(); return false }
  return true;
}
function orderData(){
  const d = DEPTS[state.dept]; const chef = d.chefs.find(c=>c[0]===state.chef[state.dept]);
  const rows = cart().map(r=>({it:findItem(state.dept,r.id),q:num(r.q)}));
  const order = Object.keys(CATS);
  rows.sort((a,b)=> order.indexOf(a.it.id.slice(0,2))-order.indexOf(b.it.id.slice(0,2)) || a.it.id.localeCompare(b.it.id));
  return {no:state.nums[state.dept].no, d, chef, rows, date:$("date").value, when:WHEN[$("when").value], prio:state.prio, notes:$("notes").value.trim()};
}

    <div class="pp-foot"><span>Old Town Falafel · فلافل البلدة القديمة</span><span class="pgno"></span><span dir="ltr">${o.no}</span></div>`;
  return pg;
}
async function buildPdf(){
  const o = orderData(); const stage = $("pdfStage"); stage.innerHTML="";
  const pages=[]; let pg = pageShell(o,0); stage.appendChild(pg); pages.push(pg);
  const fits = p => { const b=p.querySelector(".pp-body"); return b.scrollHeight <= b.clientHeight };
  const add = (html) => {
    let tb = pg.querySelector("tbody"); tb.insertAdjacentHTML("beforeend",html);
    if(!fits(pg)){ tb.lastElementChild.remove(); pg = pageShell(o,pages.length); stage.appendChild(pg); pages.push(pg); pg.querySelector("tbody").insertAdjacentHTML("beforeend",html) }
  };
  let lastCat=null, n=0;
  o.rows.forEach(({it,q})=>{
    const c = it.id.slice(0,2);
    if(c!==lastCat){ lastCat=c; add(`<tr class="cat"><td colspan="6">${CATS[c].en}<span>${CATS[c].ar}</span></td></tr>`) }
    n++; add(`<tr><td class="n">${n}</td><td class="i">${it.id}</td><td>${it.en}</td><td class="ar">${it.ar}</td><td class="q">${fmt(q)}</td><td class="u">${UNITS[it.u].en} · ${UNITS[it.u].ar}</td></tr>`);
  });
  // notes + signatures after table
  const tail = `<div class="pp-tail">${o.notes?`<div class="notes" dir="auto"><small>ملاحظات · Notes</small>${o.notes.replace(/[<>&]/g,s=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[s]))}</div>`:""}
    <div class="sign"><div><span>Chef signature</span><span dir="rtl">توقيع الشيف</span></div><div><span>Received by (Purchasing)</span><span dir="rtl">توقيع المستلم (المشتريات)</span></div></div></div>`;
  pg.querySelector(".pp-body").insertAdjacentHTML("beforeend",tail);
  if(!fits(pg)){ pg.querySelector(".pp-tail").remove(); pg = pageShell(o,pages.length); stage.appendChild(pg); pages.push(pg); pg.querySelector("table").remove(); pg.querySelector(".pp-body").insertAdjacentHTML("beforeend",tail) }
  pages.forEach((p,i)=>p.querySelector(".pgno").textContent = `${i+1} / ${pages.length}`);
  try{ await document.fonts.ready }catch(e){}
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"pt",format:"a4",compress:true});
  const imgs=[];
  for(let i=0;i<pages.length;i++){
    const cv = await html2canvas(pages[i],{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
    const data = cv.toDataURL("image/jpeg",0.9); imgs.push(data);
    if(i) pdf.addPage();
    pdf.addImage(data,"JPEG",0,0,595.28,841.89);
  }
  stage.innerHTML="";
  return {blob: pdf.output("blob"), imgs, o};
}
function waText(o){
  const ar = state.lang==="ar";
  const lines = ar ? [
    `*نموذج طلب بضاعة محلي – فلافل البلدة القديمة*`,`رقم الطلب: ${o.no} – ${o.chef[1]}`,`القسم: ${o.d.ar}`,`الشيف: ${o.chef[1]}`,`التاريخ: ${o.date}`,`مطلوب قبل: ${o.when.ar}`,`الأولوية: ${PRIO[o.prio].ar}`,`عدد الأصناف: ${o.rows.length}`,``,`ملف الطلب PDF مرفق.`
  ] : [
    `*In-house Products Order – Old Town Falafel*`,`Order no: ${o.no} – ${o.chef[0]}`,`Department: ${o.d.en}`,`Chef: ${o.chef[0]}`,`Date: ${o.date}`,`Needed by: ${o.when.en}`,`Priority: ${PRIO[o.prio].en}`,`Items: ${o.rows.length}`,``,`The order PDF is attached.`
  ];
  return lines.join("\n");
}
function phoneIntl(p){ let d=toLatinDigits(p).replace(/\D/g,""); if(d.startsWith("00")) d=d.slice(2); else if(d.startsWith("0")) d="971"+d.slice(1); return d }
async function makePdf(){
  if(!validate()) return;
  const btn = $("makePdf"); btn.disabled = true; const old = btn.innerHTML; btn.textContent = tr("building");
  try{
    btn.textContent = tr("numbering");
    await ensureNo();
    btn.textContent = tr("building");
    state.pdf = await buildPdf(); state.pdf.dept = state.dept;
    logOrder(state.pdf.o);
    $("rvNo").textContent = state.pdf.o.no; $("rvChef").textContent = "· " + (state.lang==="ar" ? state.pdf.o.chef[1] : state.pdf.o.chef[0]);
    $("rvLocal").hidden = state.nums[state.dept].shared;
    $("thumbs").innerHTML = state.pdf.imgs.map((s,i)=>`<img src="${s}" alt="PDF page ${i+1}">`).join("");
    $("waBtn").href = `https://wa.me/${phoneIntl($("phone").value)}?text=${encodeURIComponent(waText(state.pdf.o))}`;
    $("saveStatus").hidden = true;
    $("reviewSheet").hidden = false;
  }catch(e){ console.error(e); toast(tr("pdfFail")) }
  finally{ btn.disabled=false; btn.innerHTML = old; btn.querySelector("[data-t]") && (btn.querySelector("[data-t]").textContent = tr("makePdf")) }
}
function markSent(){
  const d = state.pdf ? state.pdf.dept : state.dept;
  const held = state.nums[d];
  if(held && held.shared){ getDb().then(db=>{ if(db) db.doc("orders/"+pad(held.n)).update({status:"sent", sentAt:new Date().toISOString()}).catch(()=>{}) }) }
  state.carts[d] = []; state.nums[d] = null; saveNums(); persist();
  $("notes").value = ""; state.prio = "normal";
  applyLang();
}
function status(msg,bad){ const s=$("saveStatus"); s.textContent=msg; s.classList.toggle("bad",!!bad); s.hidden=false }
async function getDownloads(){ try{ return (window.claude && window.claude.use) ? await window.claude.use("downloads") : null }catch(e){ return null } }
async function savePdf(){
  if(!state.pdf) return;
  const name = `${state.pdf.o.no}-${state.pdf.o.chef[0].replace(/\s+/g,"-")}.pdf`;
  // 1) native share with the file (phones, when the page runs in a normal browser)
  try{
    const file = new File([state.pdf.blob], name, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:name, text:waText(state.pdf.o)});
      markSent(); status(tr("sentClear")); return;
    }
  }catch(e){ if(e && e.name==="AbortError"){ status(tr("declined"),true); return } }
  // 2) the viewer's save prompt
  const downloadsNS = await getDownloads();
  if(!downloadsNS && !(window.claude && window.claude.use)){
    try{
      const url = URL.createObjectURL(state.pdf.blob); const a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000); markSent(); status(tr("savedClear")); return;
    }catch(e){}
  }
  if(downloadsNS){
    try{ await downloadsNS.save({filename:name, data:state.pdf.blob}); markSent(); status(tr("savedClear")) }
    catch(e){ status(e && e.code==="declined" ? tr("declined") : (e && e.code==="rate_limited" ? "…" : tr("unavailable")), true) }
    return;
  }
  status(tr("unavailable"), true);
}

/* ---------- events ---------- */
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;state.lang=b.dataset.lang;store.set("otf.lang",state.lang);applyLang()});
$("deptSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;state.dept=b.dataset.d;store.set("otf.dept",state.dept);render()});
$("chef").addEventListener("change",()=>{state.chef[state.dept]=$("chef").value;store.set("otf.chef."+state.dept,$("chef").value)});
$("prio").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;state.prio=b.dataset.v;[...$("prio").children].forEach(x=>x.setAttribute("aria-pressed",x===b))});
$("openPicker").addEventListener("click",openPicker);
$("q").addEventListener("input",renderResults);
$("q").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const f=$("results").querySelector(".res"); if(f){ e.preventDefault(); choose(f.dataset.id) } } });
$("cats").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;state.cat=b.dataset.c;renderCats();renderResults();$("q").focus()});
$("results").addEventListener("click",e=>{const b=e.target.closest(".res");if(b)choose(b.dataset.id)});
$("pickQty").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); commitPick(false) } });
$("pickQty").addEventListener("input",()=>$("pickErr").hidden=true);
$("addNext").addEventListener("click",()=>commitPick(false));
$("addDone").addEventListener("click",()=>commitPick(true));
$("backSearch").addEventListener("click",()=>{showSearch();renderResults();$("q").focus()});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closeSheet(b.closest(".scrim"))));
document.querySelectorAll(".scrim").forEach(s=>s.addEventListener("click",e=>{ if(e.target===s) closeSheet(s) }));
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.querySelectorAll(".scrim").forEach(s=>s.hidden=true) });
$("lines").addEventListener("input",e=>{ if(e.target.dataset.i!=null){ markUsed(); edited(); cart()[+e.target.dataset.i].q = toLatinDigits(e.target.value); e.target.classList.toggle("err", !(num(e.target.value)>0)); persist() } });
$("lines").addEventListener("click",e=>{ const b=e.target.closest("[data-rm]"); if(!b)return; markUsed(); edited(); cart().splice(+b.dataset.rm,1); persist(); render() });
$("phone").addEventListener("input",()=>store.set("otf.phone",$("phone").value));
$("newOrder").addEventListener("click",()=>{ state.carts[state.dept]=[]; state.nums[state.dept]=null; saveNums(); $("notes").value=""; state.prio="normal"; markUsed(); persist(); applyLang(); toast(tr("cleared")) });
$("makePdf").addEventListener("click",makePdf);
$("savePdf").addEventListener("click",savePdf);
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

$("phone").value = store.get("otf.phone") || "";
$("date").value = new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

applyLang();
</script>
